name: Validate extension
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run package
      - name: Test extension host and installed VSIX (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:package
      - name: Test extension host and installed VSIX (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ runner.os }}
          path: artifacts/*.vsix
